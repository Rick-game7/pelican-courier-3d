<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pelican Courier · 3D Ride</title><style>:root{--c:#7fe5ff;--o:#ffb36b}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111c;color:#f3f7ff;font-family:Inter,system-ui,sans-serif}#stage{position:fixed;inset:0}.hud{position:fixed;inset:0;padding:28px 32px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border:1px solid #7fe5ff80;border-radius:14px;display:grid;place-items:center;background:#0c1a2ae8;font-size:22px}.eyebrow,.kicker,.label{letter-spacing:.2em;text-transform:uppercase;font-size:10px;color:var(--c);font-weight:700}.title{font-size:21px;font-weight:700}.sub{font-size:12px;color:#9eabc5}.badge,.panel{border:1px solid #ffffff22;border-radius:16px;background:#0b1728bf;padding:12px 16px;backdrop-filter:blur(15px)}.badge{font-size:11px;color:#c8d3e7}.center{margin:auto 0;max-width:380px}.kicker{color:var(--o)}h1{font-size:clamp(52px,7vw,88px);line-height:.88;letter-spacing:-.07em;margin:12px 0 18px}p{font-size:14px;line-height:1.7;color:#bdc9dc}.panel{pointer-events:auto;min-width:290px}.panelhead{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.value{color:var(--c)}.row{display:flex;justify-content:space-between;gap:14px;margin:12px 0;color:#9eabc5;font-size:12px}.range{width:145px;accent-color:var(--c)}.stats{display:flex;gap:26px;align-items:end;padding:0 4px 4px}.stat{font-size:25px;font-weight:700;margin-top:4px}.muted{font-size:10px;letter-spacing:.15em;color:#8190aa}@media(max-width:720px){.hud{padding:18px}.badge,.stats{display:none}.center{margin-top:120px}h1{font-size:56px}.bottom{align-items:stretch}.panel{width:100%}}</style></head><body><div id="stage"></div><div class="hud"><header class="top"><div class="brand"><div class="mark">🪶</div><div><div class="eyebrow">FIELD NOTES / 07</div><div class="title">Pelican Courier</div><div class="sub">a small ride across the evening tide</div></div></div><div class="badge">INTERACTIVE 3D SCENE · v1.0</div></header><main class="center"><div class="kicker">THE LONG WAY HOME</div><h1>Ride the<br><i>blue hour.</i></h1><p>一只鹈鹕，一辆单速车，和一条通往海边的路。拖动画面观察细节，调整速度，让风替你记住这段旅程。</p></main><footer class="bottom"><div class="panel"><div class="panelhead"><span>Ride controls</span><span class="value" id="sv">72 km/h</span></div><div class="row"><span>Velocity</span><input id="speed" class="range" type="range" value="72"></div><div class="row"><span>Daylight</span><input id="light" class="range" type="range" value="38"></div><div class="row"><span>Feather shimmer</span><input id="shine" class="range" type="range" value="64"></div></div><div class="stats"><div><div class="muted">ROUTE</div><div class="stat">SALT / 04</div></div><div><div class="muted">ELEVATION</div><div class="stat" style="color:var(--o)">+18 m</div></div><div><div class="muted">MOOD</div><div class="stat">CALM</div></div></div></footer></div><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';import{OrbitControls as O}from'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';const s=new T.Scene(),c=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);c.position.set(7,4.3,10);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;stage.appendChild(r.domElement);const o=new O(c,r.domElement);o.enableDamping=true;o.target.set(0,1.4,0);const h=new T.HemisphereLight(0x8fb5d8,0x14222d,2.2);s.add(h);const sun=new T.DirectionalLight(0xffbf88,3);sun.position.set(-5,9,4);s.add(sun);const M=(x,q=.7,m=0)=>new T.MeshStandardMaterial({color:x,roughness:q,metalness:m}),g=new T.Group();s.add(g);const floor=new T.Mesh(new T.PlaneGeometry(80,80),M(0x0b1b24,1));floor.rotation.x=-Math.PI/2;s.add(floor);const road=new T.Mesh(new T.PlaneGeometry(9,80),M(0x18242d,1));road.rotation.x=-Math.PI/2;road.position.y=.01;s.add(road);for(let z=-35;z<40;z+=4){let d=new T.Mesh(new T.BoxGeometry(.06,.01,1.6),M(0x66737a));d.position.set(0,.02,z);s.add(d)}const bike=new T.Group();g.add(bike),black=M(0x18232a,.28,.8),rubber=M(0x10151a),chrome=M(0xb9d4d8,.18,.75),ws=[];for(let z of[-1.14,1.14]){let w=new T.Mesh(new T.TorusGeometry(1.03,.075,16,64),rubber);w.rotation.y=Math.PI/2;w.position.set(0,1.08,z);bike.add(w);ws.push(w)}const tube=(a,b,q=.055,m=black)=>{let v=new T.Vector3().subVectors(b,a),n=new T.Vector3().addVectors(a,b).multiplyScalar(.5),x=new T.Mesh(new T.CylinderGeometry(q,q,v.length,12),m);x.position.copy(n);x.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v.normalize());bike.add(x)},A=new T.Vector3(0,1.08,-1.14),B=new T.Vector3(0,1.08,1.14),C=new T.Vector3(0,1.02,0),D=new T.Vector3(0,2.02,-.42),E=new T.Vector3(0,2,.62);tube(A,C);tube(C,B);tube(A,D);tube(D,C);tube(C,E);tube(E,B);tube(E,new T.Vector3(0,2.3,.75));tube(new T.Vector3(0,2.3,.75),new T.Vector3(0,2.3,.38),.045,chrome);let sa=new T.Mesh(new T.BoxGeometry(.28,.07,.5),rubber);sa.position.copy(D);bike.add(sa);let ca=new T.Mesh(new T.BoxGeometry(.75,.045,.045),chrome);ca.position.copy(C);bike.add(ca);const bird=new T.Group();bird.position.set(0,2.2,0);g.add(bird);const f=M(0xdde8e7,.64),dk=M(0x27363c,.7),bk=M(0xf0b46d,.55);let bo=new T.Mesh(new T.SphereGeometry(.86,32,20),f);bo.scale.set(.82,1.12,1.18);bird.add(bo);let ch=new T.Mesh(new T.SphereGeometry(.55,28,18),M(0xf7f3df,.8));ch.scale.set(.92,1.25,.5);ch.position.set(0,.03,.63);bird.add(ch);let he=new T.Mesh(new T.SphereGeometry(.56,32,20),f);he.position.set(0,.92,.38);bird.add(he);for(let x of[-.28,.28]){let e=new T.Mesh(new T.SphereGeometry(.075,16,12),M(0x10171b,.15,.3));e.position.set(x,1.04,.86);bird.add(e)}let bi=new T.Mesh(new T.SphereGeometry(.42,24,12),bk);bi.scale.set(.6,.28,1.7);bi.position.set(0,.69,1);bird.add(bi);let po=new T.Mesh(new T.SphereGeometry(.36,24,16),M(0xe09b59,.72));po.scale.set(.86,.65,.55);po.position.set(0,.48,1.12);bird.add(po);for(let x of[-.54,.54]){let w=new T.Mesh(new T.SphereGeometry(.46,24,16),dk);w.scale.set(.34,1.12,.66);w.position.set(x,.18,.1);w.rotation.z=x*-.45;bird.add(w)}let t=0,cl=new T.Clock(),sp=document.querySelector('#speed'),li=document.querySelector('#light'),sh=document.querySelector('#shine');function loop(){requestAnimationFrame(loop);let d=cl.getDelta(),v=+sp.value/100;t+=d;ws.forEach(w=>w.rotation.x-=d*(1+v*8));bird.position.y=2.2+Math.sin(t*4*v)*.045;ca.rotation.z=t*5*v;let l=+li.value/100;sun.intensity=.6+l*3.3;h.intensity=.8+l*2.1;f.roughness=.9-(+sh.value/100)*.55;o.update();r.render(s,c)}loop();sp.oninput=()=>sv.textContent=sp.value+' km/h';onresize=()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};</script></body></html>
